<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prueba responsive del proceso · Oriavision</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e6e9;color:#242631;font:14px Arial,sans-serif}header{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px}label{font-weight:600}select{font:inherit;padding:8px}main{display:flex;justify-content:center;padding:0 20px 24px;overflow:auto}iframe{display:block;width:390px;height:820px;flex-shrink:0;border:0;background:white;box-shadow:0 4px 24px #0002}
</style>
</head>
<body>
<header><label for="viewport-width">Ancho de pantalla</label><select id="viewport-width"><option value="320">320 px</option><option value="360">360 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="768">768 px</option></select></header>
<main><iframe id="mobile-preview" title="Diseño web en pantalla móvil" src="/servicios/diseno-web/#como-trabajamos"></iframe></main>
<script>
const widthControl = document.querySelector('#viewport-width');
const preview = document.querySelector('#mobile-preview');
widthControl.addEventListener('change', () => { preview.style.width = widthControl.value + 'px'; });
</script>
</body>
</html>
